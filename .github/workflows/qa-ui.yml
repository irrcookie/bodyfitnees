name: QA UI bot
on:
  workflow_dispatch:
  issues:
    types: [opened, labeled]
jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.issue.labels.*.name, ','), 'bot-qa')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: qa
        run: node scripts/qa-ui.mjs && node --test tests/*.test.mjs
      - if: github.event.issue.number
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'QA UI bot：iPhone 16 Pro Max PWA 契約同 DB 測試已通過。'
            })
