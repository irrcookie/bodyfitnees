name: 每日教練
on:
  schedule:
    - cron: "0 0 * * *" # 08:00 HKT
  workflow_dispatch:
jobs:
  coach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/daily-coach.mjs
      - name: Commit coach message
        run: |
          git config user.name "bodyfit-coach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/coach.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: 每日教練建議"
          git push
