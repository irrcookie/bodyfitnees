name: Issue 入庫
on:
  issues:
    types: [opened, edited]
jobs:
  ingest:
    if: contains(join(github.event.issue.labels.*.name, ','), 'ingest')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/ingest-issue.mjs
      - name: Commit DB
        run: |
          git config user.name "bodyfit-ingest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/*.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: ingest issue #${{ github.event.issue.number }}"
          git push
      - name: Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '已嘗試入庫。Dashboard 喺 GitHub Pages 更新之後會見到。'
            })
