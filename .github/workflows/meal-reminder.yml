name: 飲食提醒
on:
  schedule:
    - cron: "30 1 * * *"   # 09:30 HKT
    - cron: "30 5 * * *"   # 13:30 HKT
    - cron: "0 12 * * *"   # 20:00 HKT
  workflow_dispatch:
    inputs:
      slot:
        description: breakfast / lunch / dinner
        default: lunch
jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pick slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "name=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            hour=$(TZ=UTC date +%H)
            case "$hour" in
              01) echo "name=breakfast" >> $GITHUB_OUTPUT ;;
              05) echo "name=lunch" >> $GITHUB_OUTPUT ;;
              *) echo "name=dinner" >> $GITHUB_OUTPUT ;;
            esac
          fi
      - run: node scripts/meal-reminder.mjs ${{ steps.slot.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
