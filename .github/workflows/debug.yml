name: Debug bot
on:
  issues:
    types: [opened, labeled]
jobs:
  debug:
    if: contains(join(github.event.issue.labels.*.name, ','), 'bot-debug')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: run
        continue-on-error: true
        run: |
          node scripts/validate-db.mjs
          node scripts/qa-ui.mjs
          node --check assets/js/app.js
          node --check assets/js/store.js
          node --check assets/js/charts.js
      - uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.run.outcome }}' === 'success';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? 'Debug bot：validate / QA / JS syntax 全部通過。如果畫面仍然有問題，喺 Cursor 對話貼 iPhone 截圖。'
                : 'Debug bot：檢查失敗，請睇 Actions log。常見原因：JSON schema、safe-area CSS、或者 JS syntax。'
            })
